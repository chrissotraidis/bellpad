name: Source release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on Apple ARM64
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build tools
        run: brew install cmake ninja ripgrep sdl2

      - name: Verify source release
        run: ./scripts/verify-release-candidate.sh
